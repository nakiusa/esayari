name: Esayari
options:
  bundleIdPrefix: com.shuyafukai
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
# 広告の SDK。一覧の下のバナーに使う。
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.9.0

targets:
  Esayari:
    type: application
    platform: iOS
    sources: [Esayari]
    dependencies:
      - package: GoogleMobileAds
    info:
      path: Esayari/Info.plist
      properties:
        # ponytail: Google のテスト用 ID。AdMob でアプリと広告ユニットを作ったら本物に差し替える（Ads.swift の bannerUnit も）。
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuyafukai.esayari
        PRODUCT_NAME: Esayari
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: えさやり帳
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: B54UXU8NGQ
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
